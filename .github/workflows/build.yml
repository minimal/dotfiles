# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    # The type of runner that the job will run on
    runs-on: ${{ matrix.os }}
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v6
        with:
          # Shallow clones won't work
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31
      - name: Run Flake Checks
        if: ${{ matrix.os != 'ubuntu-latest' }}
        run: |
          nix flake check -v --show-trace --no-build --impure
        env:
          NIXPKGS_ALLOW_UNFREE: 1 # for terraform
        timeout-minutes: 20
      - name: Run Flake show
        run: |
          nix flake show
        timeout-minutes: 240

  # Mocked tests for bin/nixpkgs-update-safe; no nix build needed
  nixpkgs-update-safe-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: extractions/setup-just@v4
      - name: Install jq
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            brew install jq
          else
            sudo apt-get update && sudo apt-get install -y jq
          fi
      - name: Run nixpkgs-update-safe tests
        run: just nix-update-safe-test
        timeout-minutes: 10
